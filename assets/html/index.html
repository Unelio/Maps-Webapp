<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Maps</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  connect-src 'self';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: https: http:;
  frame-src 'self';
">

<link rel="manifest" href="manifest.json">

<link rel="icon" sizes="512x512" href="favicon.png">
<meta name="application-name" content="Maps">

<meta name="apple-mobile-web-app-title" content="Maps">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="assets/images/manifest/apple-touch-icon.png">

<meta name="msapplication-tooltip" content="Maps">
<meta name="msapplication-TileColor" content="#ffffff">
<meta name="msapplication-TileImage" content="assets/images/manifest/apple-touch-icon.png">

<link rel="stylesheet" type="text/css" href="assets/fonts/roboto/roboto.css">
<link rel="stylesheet" type="text/css" href="assets/fonts/fontello/fontello.css">
<link rel="stylesheet" href="assets/css/styles.css?t={{ASSET_VERSION}}">

<script>
if (typeof navigator.serviceWorker !== 'undefined') {
  navigator.serviceWorker.register('sw.js')
}
</script>
</head>

<body>
<header>
  <div id="mapInfo">
    <img id="mapIcon" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'%3E%3C/svg%3E" alt="map icon">
    <div>
      <div id="mapTitle"></div>
      <div id="mapZoom">Zoom : --</div>
    </div>
  </div>
  <button id="mapSch"></button>
  <button id="mapPoi"></button>
  <button id="mapBtn"></button>
</header>

<div id="schOverlay">
<span id="closeSchOverlay">&times;</span>
  <div id="schSearchPanel">
    <div class="sch-header">
      <h2>Recherche</h2>
    </div>
    <form id="schSearchForm">
      <input id="schSearchInput" type="search" placeholder="Rechercher une adresse" autocomplete="off">
      <button type="submit" id="schSearchSubmit" hidden>Rechercher</button>
    </form>
  </div>
  <div id="schSearchStatus" aria-live="polite"></div>
</div>

<div id="poiOverlay">
<span id="closePoiOverlay">&times;</span>
{{POI_PANEL}}
</div>

{{POI_ADD_OVERLAY}}

{{POI_FOLDER_RENAME_OVERLAY}}

{{POI_DELETE_OVERLAY}}

<div id="mapOverlay">
<span id="closeMapOverlay">&times;</span>
  <div class="map-panel">
    <div class="map-header">
      <h2>Cartes</h2>
      <div class="map-summary">{{MAPS_COUNT}} carte(s)</div>
    </div>
    <ul>
{{MAP_OPTIONS}}    </ul>
  </div>
</div>

<iframe id="mapFrame"></iframe>

<footer>
  <div id="footerControls">
    <button id="locateBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    </button>
    <div id="footerZoom">
      <button id="zoomInBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
      <button id="zoomOutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
          <path d="M5 12h14"/>
        </svg>
      </button>
    </div>
  </div>
</footer>

<script>window.defaultMap = {{DEFAULT_MAP_JSON}}; window.defaultZoom = {{DEFAULT_ZOOM_JSON}}; window.defaultCenter = {{DEFAULT_CENTER_JSON}};</script>
<script src="assets/js/app.js"></script>
<script src="assets/js/poi.js"></script>
<script src="assets/js/search.js"></script>

</body>
</html>
